[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "preprocessing"
version = "1.0.0"
requires-python = ">= 3.12"
dependencies = [
    "click==8.4.2",
    "joblib==1.5.2",
    "loguru==0.7.3",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
matrix = [
    "huggingface-hub==0.34.0",
    "numpy==2.2.6",
    "pillow==12.0.0",
    "imageio[ffmpeg]==0.6.0",
]
ctrl_world = [
    "diffusers==0.37.1",
    "opencv-python==4.12.0.88",
    "mediapy==1.2.6",
    "torch==2.9.0",
    "torchvision==0.24.0",

]
all = [
    "preprocessing[matrix,ctrl_world]", 
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu126"}
torchvision = {index = "pytorch-cu126"}

[tool.uv]
package = false